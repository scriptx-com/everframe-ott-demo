name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:web

  android:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        target: [phone, tv]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Prebuild
        run: |
          if [ "${{ matrix.target }}" = tv ]; then export EXPO_TV=1; fi
          npx expo prebuild --clean --platform android --no-install
      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a -x lint

  apple-tv:
    runs-on: macos-15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: EXPO_TV=1 npx expo prebuild --clean --platform ios
      - name: Build for the tvOS simulator
        run: |
          xcodebuild -workspace ios/NocturneTV.xcworkspace -scheme NocturneTV \
            -configuration Release -sdk appletvsimulator \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20
