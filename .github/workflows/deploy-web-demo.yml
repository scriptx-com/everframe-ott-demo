name: Deploy web demo

# Publishes the demo-mode web build (EXPO_PUBLIC_DEMO_MODE=1) to
# https://ott-demo.everframe.dev, a Cloudflare static-assets Worker configured
# in wrangler.jsonc. Runs on every push to main and on demand. Pull requests
# never deploy, so the CLOUDFLARE_API_TOKEN secret is not exposed to forks.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: deploy-web-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: web-demo
      url: https://ott-demo.everframe.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build and deploy
        run: pnpm deploy:web:demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke test
        run: |
          for _ in 1 2 3 4 5 6; do
            if curl -fsS https://ott-demo.everframe.dev/ | grep -q '<title>Nocturne TV</title>'; then
              echo "live"; exit 0
            fi
            sleep 10
          done
          echo "ott-demo.everframe.dev did not serve the app" >&2
          exit 1
